name: Release Plugin

on:
  release:
    types: [published]

jobs:
  publish:
    uses: Macro-Deck-App/GitHub-Actions/.github/workflows/publish-plugin.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ github.event.release.tag_name }}
      source: src/NeteaseCloudPilot
      cli-version: 3.0.0-beta.17
      run-stub-host: false
      upload-artifact: true
      artifact-retention-days: 7
